<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json">
<title>HOVE EFB</title>
<style>
:root{--navy:#0B2559;--bg:#F7F9FC;--bd:#E4E9F2;--t2:#5A6480;--g:#10B981;--r:#EF4444;--a:#F59E0B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:#0A0F1E;padding-bottom:80px}
header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:18px;letter-spacing:.5px}#st{font-size:12px;opacity:.9}
main{padding:14px;max-width:760px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 2px;font-size:12px;color:var(--t2);font-weight:600}
nav button.on{color:var(--navy);border-top:3px solid var(--navy)}
.c{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:15px;color:var(--navy);margin-bottom:8px}
label{display:block;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:16px;background:var(--bg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.b{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:12px 16px;font-weight:700;font-size:15px;width:100%;margin-top:10px}
.b.s{background:#fff;color:var(--navy);border:1px solid var(--navy);width:auto;padding:8px 12px;font-size:13px;margin:0}
.k{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.big{font-size:22px;font-weight:800;text-align:center;padding:14px;border-radius:10px;margin-top:10px}
.ok{background:#ECFDF5;color:var(--g)}.wa{background:#FFFBEB;color:var(--a)}.no{background:#FEF2F2;color:var(--r)}
pre{background:#1a1a2e;color:#a8d8a8;padding:10px;border-radius:8px;font-size:11px;white-space:pre-wrap;margin-top:6px}
.fr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.fr select{width:auto;padding:6px}
.muted{color:var(--t2);font-size:13px}
</style></head><body>
<header><b>HOVE EFB</b><span id="st">…</span></header>
<main id="m"></main>
<nav id="nv"></nav>
<script>
const SB='https://rjwtzwoojfsvpdopmocv.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqd3R6d29vamZzdnBkb3Btb2N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMDk3NzAsImV4cCI6MjA5MDg4NTc3MH0.pr2pCDA57woTwl0EkP41jUHwmuDfgyUfa046HF3yg1E';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation'};
const LS=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id), v=id=>$(id)?.value?.trim()||'';
const D={pilots:[],aircraft:[],flights:[],manex:[],sigs:[]};
let tab='vols',me=LS('efb_me'),flt=LS('efb_flt');

/* ── DATA + OFFLINE ── */
async function get(t,q=''){try{const r=await fetch(`${SB}/rest/v1/${t}?${q}`,{headers:H});if(!r.ok)throw 0;const j=await r.json();LS('c_'+t,j);return j}catch(e){return LS('c_'+t)||[]}}
function queue(){return LS('efb_q')||[]}
async function send(t,d){ // écrit en ligne, sinon file d'attente
  try{const r=await fetch(`${SB}/rest/v1/${t}`,{method:'POST',headers:H,body:JSON.stringify(d)});if(!r.ok)throw 0;return true}
  catch(e){LS('efb_q',[...queue(),{t,d}]);status();return false}}
async function flush(){const q=queue();if(!q.length||!navigator.onLine)return;const rest=[];
  for(const i of q){try{const r=await fetch(`${SB}/rest/v1/${i.t}`,{method:'POST',headers:H,body:JSON.stringify(i.d)});if(!r.ok)throw 0}catch(e){rest.push(i)}}
  LS('efb_q',rest);status()}
function status(){const q=queue().length;$('st').textContent=(navigator.onLine?'● En ligne':'○ Hors-ligne')+(q?` · ${q} en attente`:'')}
addEventListener('online',()=>{flush();status()});addEventListener('offline',status);
async function load(){[D.pilots,D.aircraft,D.flights,D.manex,D.sigs]=await Promise.all([get('pilots'),get('aircraft'),get('flights','status=eq.RELEASED&order=departure_time.desc'),get('manex_documents','order=created_at.desc'),get('manex_signatures')]);
  D.flights=D.flights.filter?.(f=>f.ofp_data)||[];}
const ofp=f=>{try{return JSON.parse(f.ofp_data||'{}')}catch(e){return{}}};

/* ── NAV ── */
const T=[['vols','✈️ Vols'],['wb','⚖️ M&C'],['frat','⚠️ FRAT'],['post','📝 Post-vol'],['lib','📚 Biblio']];
function nav(){$('nv').innerHTML=T.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}
function render(){nav();status();if(!me){return login()}({vols,wb,frat,post,lib})[tab]()}
function login(){$('m').innerHTML=`<div class="c"><h2>Identification CDB</h2><select id="me"><option value="">Choisir…</option>${D.pilots.map(p=>`<option value="${p.id}">${esc(p.first_name+' '+p.last_name)}</option>`).join('')}</select><button class="b" onclick="me=v('me');if(me){LS('efb_me',me);render()}">Entrer</button></div>`}
const fltBar=()=>`<div class="c"><label>Vol actif</label><select id="fsel" onchange="flt=v('fsel');LS('efb_flt',flt)"><option value="">— aucun —</option>${D.flights.map(f=>`<option value="${f.id}" ${flt===f.id?'selected':''}>${esc(f.departure)}→${esc(f.arrival)} · ${(f.departure_time||'').slice(0,10)}</option>`).join('')}</select></div>`;

/* ── VOLS / OFP ── */
function vols(){$('m').innerHTML=(D.flights.length?D.flights.map(f=>{const d=ofp(f),dow=+d.dow||1065,zfw=dow+(+d.pax||0)+(+d.cargo||0),tow=zfw+(+d.fuelBlock||0);
return `<div class="c"><h2>${esc(f.departure)} → ${esc(f.arrival)} <span class="muted">${esc(d.fl||'')}</span></h2>
<div class="muted">${(f.departure_time||'').slice(0,16).replace('T',' ')}Z · ${esc(d.cdb||'')} · ${esc(d.acReg||'')} · ${esc(d.ref||'')}</div>
<div class="k"><span>TOW / ZFW</span><b>${tow} / ${zfw} kg</b></div><div class="k"><span>Block / Trip fuel</span><b>${d.fuelBlock||'—'} / ${d.fuelTrip||'—'} kg</b></div>
<div class="k"><span>Dégagement</span><b>${esc(d.alt||'—')}</b></div>
${d.route?`<label>Route</label><pre>${esc(d.route)}</pre>`:''}
${d.metarDep?`<label>Météo dép.</label><pre>${esc(d.metarDep)}</pre>`:''}${d.metarArr?`<label>Météo dest.</label><pre>${esc(d.metarArr)}</pre>`:''}${d.metarAlt?`<label>Météo dgt</label><pre>${esc(d.metarAlt)}</pre>`:''}
${d.notams?`<label>NOTAMs</label><pre>${esc(d.notams)}</pre>`:''}
<button class="b" onclick="flt='${f.id}';LS('efb_flt',flt);tab='frat';render()">Sélectionner → FRAT</button></div>`}).join(''):'<div class="c muted">Aucun OFP releasé.</div>')}

/* ── MASSE & CENTRAGE (SR22 G7+, mêmes paramètres que HOVE OPS) ── */
function wb(){$('m').innerHTML=`<div class="c"><h2>Masse & Centrage — SR22 G7+</h2>
<div class="g2"><div><label>BEW kg</label><input id="w1" type="number" value="1089" oninput="calc()"></div><div><label>Bras BEW po</label><input id="w2" type="number" value="138.5" oninput="calc()"></div>
<div><label>Pilote kg</label><input id="w3" type="number" oninput="calc()"></div><div><label>Avant D kg</label><input id="w4" type="number" oninput="calc()"></div>
<div><label>AR G kg</label><input id="w5" type="number" oninput="calc()"></div><div><label>AR D kg</label><input id="w6" type="number" oninput="calc()"></div>
<div><label>Bagages kg</label><input id="w7" type="number" oninput="calc()"></div><div><label>Carburant déc. (L)</label><input id="w8" type="number" oninput="calc()"></div>
<div><label>Trip fuel (L)</label><input id="w9" type="number" oninput="calc()"></div></div>
<div class="k"><span>ZFW</span><b id="o1">—</b></div><div class="k"><span>TOW</span><b id="o2">—</b></div><div class="k"><span>CG déc.</span><b id="o3">—</b></div><div class="k"><span>CG att.</span><b id="o4">—</b></div>
<div id="ov" class="big wa">—</div>
<p class="muted" style="margin-top:8px">Bras : av. 143 · ar. 177 · bag. 208.3 · fuel 150 · densité 0.72 · limites TOW ≤ 1633 kg, CG 137.5–141.0 po. Valeurs reprises de HOVE OPS — à valider avec l'AFM/pesée.</p></div>`}
function calc(){const g=i=>+$('w'+i).value||0,[bew,bw,p1,p2,p3,p4,bg,fl,ft]=[1,2,3,4,5,6,7,8,9].map(g);
 const fk=fl*.72,zfw=bew+p1+p2+p3+p4+bg,tow=zfw+fk,m0=bew*bw+(p1+p2)*143+(p3+p4)*177+bg*208.3,
 cgT=tow?(m0+fk*150)/tow:0,fkL=Math.max(0,fl-ft)*.72,law=zfw+fkL,cgL=law?(m0+fkL*150)/law:0,ok=tow<=1633&&cgT>=137.5&&cgT<=141&&cgL>=137.5&&cgL<=141;
 $('o1').textContent=zfw.toFixed(1)+' kg';$('o2').textContent=tow.toFixed(1)+' kg';$('o3').textContent=cgT.toFixed(2)+' po';$('o4').textContent=cgL.toFixed(2)+' po';
 $('ov').className='big '+(ok?'ok':'no');$('ov').textContent=ok?'DANS L\'ENVELOPPE':'HORS LIMITES'+(tow>1633?' · MTOW dépassée':'')}

/* ── FRAT ── */
const FR=[['Météo',[['Plafond/vis. ≥ minima +500ft/1km',0],['Proche des minima',3],['Givrage/orage prévus',6]]],
['Pilote',[['Reposé, > 8h sommeil',0],['Fatigue modérée',3],['Fatigue / stress élevé',6]]],
['Récence',[['> 3 vols dans les 30 derniers jours',0],['1–2 vols / 30 j',2],['Aucun vol / 30 j',4]]],
['Piste / terrain',[['Longue, ILS dispo',0],['Courte ou approche non précision',2],['Terrain inconnu / NOTAM piste',4]]],
['Nuit / IMC',[['Jour VMC',0],['Nuit ou IMC',3],['Nuit + IMC',5]]],
['Charge de travail',[['Équipage complet, vol simple',0],['Pilote seul, vol long',2],['Pression passagers / horaires',4]]],
['Appareil',[['Aucune anomalie',0],['MEL / report d\'item',3],['Anomalie non résolue',6]]]];
function frat(){$('m').innerHTML=fltBar()+`<div class="c"><h2>FRAT — Analyse des risques pré-vol</h2>${FR.map(([n,o],i)=>`<div class="fr"><span>${n}</span><select id="fr${i}" onchange="fscore()">${o.map(([l,p])=>`<option value="${p}">${l} (${p})</option>`).join('')}</select></div>`).join('')}
<div id="fs" class="big ok">0</div><button class="b" onclick="saveFrat()">Enregistrer FRAT</button>
<p class="muted" style="margin-top:8px">Seuils par défaut : ≤10 vert · 11–20 approbation Chef Pilote · >20 approbation Direction. À aligner sur votre SMS/MANEX.</p></div>`;fscore()}
function fscore(){const s=FR.reduce((a,_,i)=>a+(+$('fr'+i).value),0),l=s<=10?['ok','VERT — vol libéré']:s<=20?['wa','ORANGE — approbation Chef Pilote']:['no','ROUGE — approbation Direction'];
 $('fs').className='big '+l[0];$('fs').textContent=s+' · '+l[1];return{s,l:l[1]}}
async function saveFrat(){const{s,l}=fscore();const a=FR.map((_,i)=>$('fr'+i).selectedOptions[0].text);
 const ok=await send('efb_frat',{pilot_id:me,flight_id:flt||null,score:s,level:l,answers:a});alert(ok?'FRAT enregistré':'Hors-ligne : en file d\'attente')}

/* ── POST-VOL + SQUAWK ── */
function post(){$('m').innerHTML=fltBar()+`<div class="c"><h2>Carnet post-vol</h2><div class="g2">
<div><label>Block off (UTC)</label><input id="p1" type="time"></div><div><label>Block on (UTC)</label><input id="p2" type="time"></div>
<div><label>Carburant restant (L)</label><input id="p3" type="number"></div><div><label>Cycles / atterr.</label><input id="p4" type="number" value="1"></div></div>
<label>Notes</label><textarea id="p5" rows="2"></textarea><button class="b" onclick="saveLog()">Enregistrer le carnet</button></div>
<div class="c"><h2>Signaler une anomalie (squawk)</h2><label>Appareil</label><select id="q1">${D.aircraft.filter(a=>a.type==='aircraft').map(a=>`<option value="${a.id}">${esc(a.name)} ${esc(a.registration||'')}</option>`).join('')}</select>
<label>Catégorie</label><select id="q2"><option>A</option><option>B</option><option>C</option><option>D</option><option>Non classée</option></select>
<label>Description</label><textarea id="q3" rows="3"></textarea><button class="b" style="background:var(--r)" onclick="saveSq()">Envoyer à la maintenance</button></div>`}
function mins(a,b){if(!a||!b)return null;const t=x=>x.split(':').reduce((h,m)=>h*60+ +m);let d=t(b)-t(a);if(d<0)d+=1440;return+(d/60).toFixed(2)}
async function saveLog(){if(!flt)return alert('Sélectionner un vol');const ok=await send('efb_flight_logs',{flight_id:flt,pilot_id:me,block_off:v('p1'),block_on:v('p2'),flight_time:mins(v('p1'),v('p2')),fuel_remaining:+v('p3')||null,cycles:+v('p4')||1,notes:v('p5')});alert(ok?'Enregistré':'Hors-ligne : en file d\'attente')}
async function saveSq(){if(!v('q3'))return alert('Description requise');const ok=await send('efb_squawks',{aircraft_id:v('q1'),pilot_id:me,flight_id:flt||null,category:v('q2'),description:v('q3')});alert(ok?'Anomalie transmise':'Hors-ligne : sera transmise au retour du réseau');$('q3').value=''}

/* ── BIBLIO + READ & INITIAL ── */
function lib(){$('m').innerHTML=`<div class="c"><h2>Bibliothèque MANEX / documents</h2>${D.manex.length?D.manex.map(d=>{const s=D.sigs.find(x=>x.document_id===d.id&&x.pilot_id===me);
return `<div class="fr"><div><b>${esc(d.title)}</b><div class="muted">v${esc(d.version||'—')}</div>${d.file_url?`<a href="${esc(d.file_url)}" target="_blank">Ouvrir →</a>`:''}</div>
${s?'<span style="color:var(--g);font-weight:700">✓ Lu</span>':`<button class="b s" onclick="sign('${d.id}')">Lu & approuvé</button>`}</div>`}).join(''):'<p class="muted">Aucun document.</p>'}</div>`}
async function sign(id){const ok=await send('manex_signatures',{document_id:id,pilot_id:me});D.sigs.push({document_id:id,pilot_id:me});render();if(!ok)alert('Hors-ligne : signature en file d\'attente')}

if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
load().then(()=>{render();flush()});
</script></body></html>
